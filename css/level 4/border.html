<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border</title>
    <style>

        .button{
            height: 50px;
            width: 50px;
            border: 5px solid red;
            border-radius: 10px;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <button class="button">click me</button>
</body>
</html>
