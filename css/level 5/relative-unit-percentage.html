<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relative unite: percentage</title>
    <style>
      #div1 {
        height: 100px;
        width: 200px;
        background-color: red;
      }
      #div2 {
        height: 50%;
        width: 30%;
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <div id="div1">
      First
      <div id="div2">Second</div>
    </div>
  </body>
</html>
